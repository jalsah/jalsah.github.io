<style>
:root{
  --bg:#1c1530;--surface:#2a2146;--line:#3d3263;--ink:#f7f0e3;--muted:#b8adcf;
  --saffron:#f2b134;--rose:#ef6f6c;--mint:#74d6b8;
  --display:"Lalezar","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{min-height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.sadu{height:14px;flex:none;border-radius:4px;opacity:.85;background:
  linear-gradient(135deg,var(--saffron) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(225deg,var(--saffron) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(315deg,var(--rose) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg,var(--rose) 25%,transparent 25%) 0 0/14px 14px,var(--surface)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 8px}
.logo{font-family:var(--display);font-size:34px;line-height:1;color:var(--saffron);margin:0;font-weight:400}
.hdr{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;position:relative}
.pill.hot{color:var(--saffron);border-color:var(--saffron)}
main{flex:1;display:flex;flex-direction:column}
section{display:flex;flex-direction:column;gap:14px;flex:1}
h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.25;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0}
.hint{color:var(--muted);font-size:14px;margin:0}
.center{text-align:center}
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;color:var(--ink);font:inherit;cursor:pointer;width:100%}
.mode:active{transform:scale(.98)}
.mode .glyph{grid-row:span 2;width:68px;height:68px;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));transition:transform .2s}
.mode .glyph svg{width:100%;height:100%;display:block}
.mode:hover .glyph,.mode:focus-visible .glyph{transform:rotate(-4deg) scale(1.05)}
.mode b{font-family:var(--display);font-weight:400;font-size:22px}
.mode > span:last-child{color:var(--muted);font-size:14px;line-height:1.5}
.mode.joinbox{cursor:default}
.mode.joinbox .row{min-width:0;grid-column:1/-1}
.mode.joinbox .btn.small{min-width:76px}
.btn.small{white-space:nowrap}
.crown{font-size:.85em;margin-inline-start:2px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--rose);color:var(--bg);font-family:var(--body);font-size:13px;font-weight:700;margin-inline-start:6px;vertical-align:middle}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted);white-space:nowrap}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:14px;color:var(--muted);font-weight:500}
input.txt,textarea.txt,.uinput input,.joinbox input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;font-size:17px}
.uinput{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 12px;direction:ltr;flex:1;min-width:0}
.uinput span{color:var(--muted);font-weight:700;padding-left:8px}
.uinput input{border:none;background:transparent;padding:10px 4px;letter-spacing:.02em}
.uinput:focus-within,input.txt:focus,textarea.txt:focus,.joinbox input:focus{outline:2px solid var(--saffron);outline-offset:1px}
input::placeholder{color:var(--muted);opacity:.7}
.msg-ok{color:var(--mint)}.msg-bad{color:var(--rose)}
.addf{display:flex;gap:8px;align-items:stretch}
.stepper{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.stepper button{width:48px;height:48px;border-radius:12px;border:none;background:var(--line);color:var(--ink);font-size:24px;cursor:pointer}
.stepper output{flex:1;text-align:center;font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.name-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--saffron);border-color:var(--saffron);color:var(--bg);font-weight:700}
.chip:disabled{opacity:.4}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:56px}
.li .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .nm[dir="ltr"]{text-align:right}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 25%,transparent)}
.card{flex:1;min-height:240px;border-radius:24px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px 20px;text-align:center;overflow:hidden}
.card .eyebrow{font-size:14px;color:var(--muted)}
.card .big{font-family:var(--display);font-size:clamp(38px,12vw,60px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.card .mid{font-family:var(--display);font-size:clamp(26px,8vw,36px);line-height:1.35;text-wrap:balance}
.card.tap{cursor:pointer}
.card.imposter{background:var(--rose);border-color:var(--rose);color:var(--bg)}
.card.imposter .eyebrow,.card.imposter .hint{color:var(--bg);opacity:.85}
.card.safe{background:var(--mint);border-color:var(--mint);color:var(--bg)}
.card.safe .eyebrow,.card.safe .hint{color:var(--bg);opacity:.85}
.card.word{border-color:var(--mint)}
.card.word .big{color:var(--mint)}
.card.prompt .big,.card.prompt .mid{color:var(--saffron)}
.btn{width:100%;min-height:56px;border:none;border-radius:16px;font:inherit;font-weight:700;font-size:18px;cursor:pointer;background:var(--saffron);color:var(--bg)}
.btn.small{width:auto;min-height:40px;padding:0 14px;font-size:15px;border-radius:12px;flex:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.danger{background:var(--rose)}
.btn.good{background:var(--mint)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:none;color:var(--saffron);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:0 4px}
:is(.btn,.chip,.mode,.pill,.link,.stepper button,.vote,.roster):focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.row{display:flex;gap:10px}
.row .btn{flex:1;min-width:0}
.foot{display:flex;flex-direction:column;gap:10px;padding-top:12px;margin-top:auto}
.codebox{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.code{font-family:var(--display);font-size:52px;line-height:1;letter-spacing:.12em;color:var(--saffron)}
.status{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.vote{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:start;min-height:56px}
.vote[aria-pressed="true"]{border-color:var(--saffron);background:color-mix(in srgb,var(--saffron) 18%,var(--surface))}
.vote .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tally{display:flex;flex-direction:column;gap:8px}
.tally .t{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.tally .bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.tally .bar i{display:block;height:100%;background:var(--saffron);border-radius:999px}
.tally .n{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.board{display:flex;flex-direction:column;gap:8px}
.board .r{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.board .r.top{border-color:var(--saffron)}
.board .rank{width:26px;text-align:center;font-family:var(--display);font-size:20px;color:var(--muted)}
.board .r.top .rank{color:var(--saffron)}
.board .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.board .pts{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.roster{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit;text-align:start;width:100%}
.roster .names{flex:1;min-width:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster .edit{color:var(--saffron);font-size:14px;font-weight:700}
.timer{width:100%;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--saffron);transform-origin:right}
.count{font-family:var(--display);font-size:72px;line-height:1;color:var(--saffron);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--saffron)}
#banner{display:flex;flex-direction:column;gap:8px}
#banner:empty{display:none}
.inv{display:flex;align-items:center;gap:10px;background:var(--saffron);color:var(--bg);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.inv .txt{flex:1;min-width:0;font-weight:700;font-size:15px}
.inv .btn{background:var(--bg);color:var(--ink)}
.inv .btn.ghost{background:transparent;border-color:var(--bg);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.spinner{margin:auto;width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--saffron);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:20px 8px 8px;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--saffron) 14%,transparent),transparent 70%);border-radius:28px}
.hero-icons{position:relative;width:230px;height:120px;margin-bottom:6px}
.hi{position:absolute;width:88px;height:88px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
.hi svg{width:100%;height:100%;display:block}
.hi1{left:0;top:22px;transform:rotate(-12deg);animation:bob 3.2s ease-in-out infinite}
.hi2{left:71px;top:0;z-index:1;width:96px;height:96px;animation:bob 3.2s ease-in-out .4s infinite}
.hi3{right:0;top:22px;transform:rotate(12deg);animation:bob 3.2s ease-in-out .8s infinite}
@keyframes bob{50%{translate:0 -6px}}
.perks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;list-style:none;margin:4px 0 0;padding:0}
.perks li{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.btn.google{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px}
.g-logo{width:22px;height:22px;display:inline-block}
.g-logo svg{width:100%;height:100%;display:block}
.btn.ghost .g-logo{width:20px;height:20px}
#gInstead{display:flex;align-items:center;justify-content:center;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{border:none;background:none;color:var(--muted);font:inherit;font-weight:700;padding:10px;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--saffron);color:var(--bg)}
#emailF{gap:8px}
#emailF .btn{margin-top:6px}
#emMsg:empty{display:none}
.link.center{align-self:center;padding:6px}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .n{font-family:var(--display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .l{font-size:13px;color:var(--muted)}
.stat.good{border-color:var(--mint)}
.stat.good .n{color:var(--mint)}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
textarea.txt{resize:vertical;min-height:84px;line-height:1.6}
#annModal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(12,8,24,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .2s ease-out}
#annModal.out{animation:fadeOut .2s ease-in forwards}
.ann-card{width:100%;max-width:400px;border-radius:28px;overflow:hidden;background:var(--surface);border:1px solid color-mix(in srgb,var(--saffron) 45%,var(--line));box-shadow:0 24px 60px rgba(0,0,0,.5);animation:cardIn .45s cubic-bezier(.2,1.4,.4,1)}
.ann-top{position:relative;height:150px;display:grid;place-items:center;background:radial-gradient(circle at 50% 120%,#ffcf5c 0%,#f08a24 45%,#d9475b 100%)}
.ann-art{width:150px;height:125px;display:block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));animation:wiggle 2.4s ease-in-out .5s infinite}
.ann-art svg{width:100%;height:100%;display:block}
.ann-spark{position:absolute;color:#fff8ec;font-size:18px;opacity:.9;animation:twinkle 1.8s ease-in-out infinite}
.ann-spark.s1{top:22px;right:28%;animation-delay:.2s}
.ann-spark.s2{top:48px;left:18%;font-size:14px;animation-delay:.7s}
.ann-spark.s3{bottom:22px;right:16%;font-size:12px;animation-delay:1.1s}
.ann-body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 22px 22px;text-align:center}
.ann-eyebrow{font-size:13px;font-weight:700;color:var(--saffron);background:color-mix(in srgb,var(--saffron) 14%,transparent);border-radius:999px;padding:3px 12px}
.ann-text{margin:0;font-family:var(--display);font-size:clamp(22px,6vw,28px);line-height:1.45;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:balance}
.ann-body .btn{margin-top:6px}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes cardIn{from{transform:translateY(30px) scale(.9);opacity:0}}
@keyframes wiggle{0%,100%{rotate:0deg}10%{rotate:-6deg}20%{rotate:5deg}30%{rotate:-3deg}40%{rotate:0deg}}
@keyframes twinkle{50%{opacity:.25;scale:.7}}
.pwbox{position:relative}
.pwbox .txt{padding-right:48px}
.eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border:none;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
.eye svg{width:22px;height:22px}
.eye[aria-pressed="true"]{color:var(--saffron)}
.eye:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
.links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;margin-top:4px}

/* avatars */
.av{flex:none;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;color:#1c1530;font-family:var(--display);line-height:1;box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 12%,transparent)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.me-btn{background:none;border:none;padding:0;border-radius:50%;cursor:pointer;display:inline-grid}
.me-btn:focus-visible,.hello-av:focus-visible,.li-who:focus-visible,.onl-i:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.hdr{align-items:center}
.pill.add{background:var(--saffron);border-color:var(--saffron);color:var(--bg);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.pill.add .badge{background:var(--bg);color:var(--saffron)}
/* home */
.hello{display:flex;align-items:center;gap:12px}
.hello-av{background:none;border:none;padding:0;border-radius:50%;cursor:pointer}
.hello-t{display:flex;flex-direction:column;min-width:0}
.hello-t b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border-radius:22px;padding:18px 10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.bigbtn:active{transform:scale(.97)}
.bigbtn.create{background:linear-gradient(160deg,color-mix(in srgb,var(--saffron) 30%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--saffron) 50%,var(--line))}
.bigbtn.join{background:linear-gradient(160deg,color-mix(in srgb,var(--mint) 24%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--mint) 45%,var(--line))}
.bb-ic{width:72px;height:72px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.bb-ic svg{width:100%;height:100%;display:block}
.bigbtn b{font-family:var(--display);font-weight:400;font-size:22px}
.bigbtn span:last-child{font-size:13px;color:var(--muted)}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;font-size:18px;letter-spacing:.12em}
.joinrow input:focus{outline:2px solid var(--saffron);outline-offset:1px}
.onl{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.onl-i{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--ink);font:inherit;font-size:12px;cursor:pointer;width:64px;flex:none}
.onl-i span[dir]{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.onl-i .dot{position:absolute;top:36px;right:8px;border:2px solid var(--bg);width:14px;height:14px}
.mode.wide{margin-top:4px}
/* friends + lists */
.li-who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:none;padding:0;color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.av-wrap{position:relative;display:inline-grid;flex:none}
.av-wrap .dot{position:absolute;bottom:-1px;right:-1px;border:2px solid var(--surface);width:13px;height:13px}
.who-t{display:flex;flex-direction:column;min-width:0;flex:1}
.who-t .nm{text-align:right}
.who-bio{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vote{gap:10px}
/* profile */
.pf-head{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px;text-align:center}
.pf-av{position:relative}
.pf-cam{position:absolute;bottom:2px;left:2px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--saffron);border:3px solid var(--bg);font-size:16px;cursor:pointer}
.pf-name{font-size:22px}
.pf-acts{justify-content:center}
.pf-acts .btn{flex:none}
label.btn{display:inline-flex;align-items:center;justify-content:center}
/* profile sheet */
.sheet-bg{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center;background:rgba(12,8,24,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .2s ease-out}
.sheet{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:28px 28px 0 0;padding:26px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));text-align:center;animation:sheetUp .3s cubic-bezier(.2,1.2,.4,1)}
.sheet .row{width:100%}
.pf-bio{margin:0;font-size:16px;line-height:1.7;max-width:36ch;white-space:pre-wrap;overflow-wrap:anywhere}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
/* one-phone players */
.players-card{display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--saffron) 16%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--saffron) 45%,var(--line));border-radius:22px;padding:16px}
.pc-t{font-family:var(--display);font-weight:400;font-size:22px;display:flex;align-items:center;gap:8px}
.pc-n{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:var(--saffron);color:var(--bg);font-family:var(--body);font-size:15px;font-weight:700}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-size:14px;max-width:100%}
.pchip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[hidden]{display:none!important}
.switch{margin:4px 0 0;text-align:center;color:var(--muted);font-size:15px}
.switch .link{font-size:15px}

/* ---------- batch 1 ---------- */
.pill.icon{font-size:16px;padding:5px 11px;display:inline-flex;align-items:center;gap:4px}
.promo{display:block;border-radius:18px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line);background:var(--surface)}
.promo img{display:block;width:100%;height:auto;max-height:220px;object-fit:cover}
.promo.preview{margin:0}
/* games grid */
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.gcard:active{transform:scale(.97)}
.gcard:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.gc-ic{width:58px;height:58px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.gc-ic svg,.gs-ic svg,.wl-art svg{width:100%;height:100%;display:block}
.gcard b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.3;text-wrap:balance}
.gc-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.gc-tags i{font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.t-on{background:color-mix(in srgb,var(--mint) 22%,transparent);color:var(--mint)}
.t-lo{background:color-mix(in srgb,var(--saffron) 20%,transparent);color:var(--saffron)}
.gs-ic{width:84px;height:84px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.sheet .btn{width:100%}
/* profile card */
.pcard{width:100%;max-width:440px;margin:auto;border-radius:28px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.5);animation:cardIn .4s cubic-bezier(.2,1.3,.4,1);align-self:center}
#pfModal{align-items:center;padding:16px}
.pcard-cover{position:relative;height:110px;background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--c) 85%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 40%,var(--bg)) 100%)}
.pc-sadu{position:absolute;left:0;right:0;bottom:0;height:12px;opacity:.55;background:
  linear-gradient(135deg,var(--bg) 25%,transparent 25%) 0 0/12px 12px,
  linear-gradient(225deg,var(--bg) 25%,transparent 25%) 0 0/12px 12px}
.pcard-av{display:flex;justify-content:center;margin-top:-56px;position:relative}
.pcard-av .av{box-shadow:0 0 0 5px var(--surface),0 10px 24px rgba(0,0,0,.4)}
.pcard-body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 20px 20px;text-align:center}
.pcard-body .pf-name{font-size:24px}
.chip-st{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 12px;background:var(--line);color:var(--muted)}
.chip-st.on{background:color-mix(in srgb,var(--mint) 20%,transparent);color:var(--mint)}
.pcard-bio{margin:4px 0 0;position:relative;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.7;max-width:34ch;white-space:pre-wrap;overflow-wrap:anywhere}
.pcard-bio::before{content:"❝";position:absolute;top:-14px;right:14px;font-size:24px;color:var(--saffron);background:var(--surface);padding:0 4px;line-height:1}
.pcard-acts{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px}
.pcard-body > .btn{width:100%}
/* welcome */
.welcome{text-align:center;align-items:center}
.wl-top{display:flex;justify-content:space-between;align-items:center;width:100%}
.wl-step{color:var(--muted);font-size:13px}
.wl-art{width:150px;height:150px;margin:18px auto 6px;filter:drop-shadow(0 16px 26px rgba(0,0,0,.4))}
.wl-d{max-width:34ch;margin-inline:auto}
.wl-dots{display:flex;gap:6px;justify-content:center}
.wl-dots i{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .2s}
.wl-dots i.on{width:22px;background:var(--saffron)}
.welcome .foot{width:100%}
/* letters game */
.hletter{display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(160deg,color-mix(in srgb,#8f7bea 28%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,#8f7bea 50%,var(--line));border-radius:24px;padding:18px}
.hl{font-family:var(--display);font-size:96px;line-height:1;color:var(--saffron);text-shadow:0 6px 0 rgba(0,0,0,.25)}
.hl-s{color:var(--saffron)}
.hform{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:10px}
.hrow > span{font-weight:700;color:var(--muted)}
.hcats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hcats span{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-family:var(--display);font-size:20px}
.htable{display:flex;flex-direction:column;gap:10px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.hc-top{display:flex;align-items:center;gap:10px}
.hc-top .nm{flex:1;min-width:0;font-weight:700;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc-tot{font-family:var(--display);font-size:22px;color:var(--saffron)}
.hc-ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ha{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:7px 9px;font:inherit;font-size:13.5px;text-align:start;min-width:0;cursor:pointer}
.ha:disabled{cursor:default}
.ha-c{color:var(--muted);font-size:11.5px}
.ha-a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.ha-p{font-family:var(--display);font-size:16px}
.ha.p10{border-color:var(--mint)} .ha.p10 .ha-p{color:var(--mint)}
.ha.p5{border-color:var(--saffron)} .ha.p5 .ha-p{color:var(--saffron)}
.ha.p0 .ha-p{color:var(--muted)}
.ha.rej{opacity:.55;text-decoration:line-through;border-color:var(--rose)}
/* chat */
.chat-fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:12px 16px;background:var(--saffron);color:var(--bg);font:inherit;font-weight:700;font-size:16px;box-shadow:0 10px 24px rgba(0,0,0,.4);cursor:pointer}
.chat-fab .badge{position:absolute;top:-6px;right:-6px;background:var(--rose);color:var(--bg);font-style:normal}
.chat-sheet{width:100%;max-width:520px;height:min(78vh,640px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));animation:sheetUp .3s cubic-bezier(.2,1.2,.4,1)}
.chat-head{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.chat-head b{font-family:var(--display);font-weight:400;font-size:20px;flex:1}
.chat-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px 2px}
.chat-empty{margin:auto}
.msg{display:flex;align-items:flex-end;gap:6px;max-width:86%;align-self:flex-start}
.msg.me{align-self:flex-end}
.msg-av{flex:none}
.bub{display:flex;flex-direction:column;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:8px 12px;min-width:0}
.msg.me .bub{background:color-mix(in srgb,var(--saffron) 22%,var(--surface));border-color:color-mix(in srgb,var(--saffron) 45%,var(--line));border-radius:18px 18px 6px 18px}
.msg-n{font-size:12px;font-weight:700;color:var(--saffron)}
.msg-t{font-size:15.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-time{font-size:10.5px;color:var(--muted);align-self:flex-end}
.emo{display:flex;gap:4px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.emo button{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
.chat-form{display:flex;gap:8px}
.chat-form .txt{flex:1;min-width:0}
/* inbox + dm */
.ib{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.ib.unread{border-color:var(--saffron)}
.ib-t{flex:1;min-width:0;display:flex;flex-direction:column}
.ib-n{font-weight:700;text-align:right}
.ib-l{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib.unread .ib-l{color:var(--ink);font-weight:700}
.ib-r{display:flex;flex-direction:column;align-items:center;gap:6px}
.ib-time{font-size:11px;color:var(--muted)}
.ib-dot{width:10px;height:10px;border-radius:50%;background:var(--saffron)}
.dm{flex:1;min-height:0}
body:has(#chatFab) main{padding-bottom:78px}
.dm-head{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px;color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.dm-list{min-height:50vh;max-height:calc(100vh - 330px)}

/* ---------- uno ---------- */
.gcard{position:relative}
.gcard.hot{border-color:color-mix(in srgb,var(--rose) 60%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--rose) 18%,var(--surface)),var(--surface))}
.gc-new{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;background:var(--rose);color:var(--bg);border-radius:999px;padding:1px 8px}
.uno{gap:10px}
.utable{position:relative;width:100%;max-width:420px;margin:4px auto 0;aspect-ratio:1/1}
.utable-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.useat{position:absolute;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:0;color:var(--ink);font:inherit;cursor:pointer;z-index:2;width:70px}
.useat .av{box-shadow:0 0 0 3px var(--bg),0 6px 14px rgba(0,0,0,.45)}
.useat.turn .av{box-shadow:0 0 0 3px var(--saffron),0 0 18px 4px color-mix(in srgb,var(--saffron) 60%,transparent);animation:pulse 1.4s ease-in-out infinite}
.us-n{font-size:11.5px;font-weight:700;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(15,11,28,.75);border-radius:999px;padding:0 7px}
.us-c{font-size:11px;font-weight:700;background:var(--saffron);color:var(--bg);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.useat.flash .us-c{background:var(--rose)}
@keyframes pulse{50%{transform:scale(1.07)}}
.ucenter{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:16px;z-index:1}
.upile,.udisc{position:relative;width:64px;aspect-ratio:2/3}
.upile{background:none;border:none;padding:0;cursor:pointer;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.upile:disabled{cursor:default}
.upile::before{content:"";position:absolute;inset:0;transform:translate(3px,3px);border-radius:8px;background:#0f0b1c}
.upile svg{position:relative}
.upile.go{animation:bob 1.2s ease-in-out infinite}
.upile.go::after{content:"اسحب";position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--saffron);white-space:nowrap}
.up-n{position:absolute;top:-8px;right:-8px;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:999px;font-size:10px;padding:0 6px;font-variant-numeric:tabular-nums}
@keyframes bob{50%{transform:translateY(-4px)}}
.udisc .ring{position:absolute;inset:-9px;border-radius:14px;border:4px solid var(--cur);box-shadow:0 0 20px 2px color-mix(in srgb,var(--cur) 55%,transparent)}
.udisc .ucard{position:absolute;inset:0;transform:rotate(-6deg);filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.udisc .ucard.top{animation:land .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes land{from{transform:translateY(-40px) rotate(-30deg) scale(1.2);opacity:.2}}
.ucard-svg{width:100%;height:100%;display:block}
.udir{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:150px;line-height:1;color:rgba(242,177,52,.12);pointer-events:none;animation:spin 9s linear infinite}
.udir.rev{animation-direction:reverse}
.ubar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.ubar.mine{border-color:var(--saffron);background:color-mix(in srgb,var(--saffron) 14%,var(--surface))}
.ub-t{font-weight:700;min-width:0}
.ub-col{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex:none}
.ub-col i{width:14px;height:14px;border-radius:50%}
.ulast{margin:0;text-align:center;color:var(--muted);font-size:13.5px}
.uno-call{align-self:center;font-family:var(--display);font-size:24px;color:var(--bg);background:var(--rose);border-radius:999px;padding:4px 18px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.uhand{display:flex;gap:0;overflow-x:auto;padding:22px 10px 6px;scrollbar-width:none;min-height:130px}
.uhand .ucard{flex:none;width:68px;aspect-ratio:2/3;margin-inline-start:-18px;background:none;border:none;padding:0;cursor:pointer;transition:transform .15s;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.uhand .ucard:first-child{margin-inline-start:0}
.uhand .ucard.ok{transform:translateY(-14px)}
.uhand .ucard.ok:active{transform:translateY(-20px) scale(1.04)}
.uhand .ucard.no{filter:brightness(.55) drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.uhand .ucard:focus-visible{outline:3px solid var(--mint);outline-offset:2px;border-radius:8px}
.ucolors{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.ucol{min-height:72px;border:none;border-radius:18px;background:var(--c);color:#1c1530;font:inherit;font-family:var(--display);font-size:22px;cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.uwin{gap:10px}
.uwin .av{box-shadow:0 0 0 4px var(--bg)}
/* ===== دفعة ٢: واتساب، مشاركة، مين قالها، صح ولا خطأ، ارسم وخمّن ===== */
.inv-row{justify-content:center;flex-wrap:wrap;margin-top:6px}
.btn.wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#0b2e17;text-decoration:none;font-weight:700}
.btn.wa svg{width:20px;height:20px;flex:none}
.btn.share{border-color:color-mix(in srgb,var(--saffron) 60%,var(--line));color:var(--saffron);font-weight:700}
.share-sheet{max-height:92vh;overflow:auto}
.share-prev{width:100%;display:grid;place-items:center;min-height:200px}
.share-img{display:block;max-height:52vh;max-width:100%;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.4);-webkit-touch-callout:default;user-select:auto}
.wform{display:flex;flex-direction:column;gap:10px}
.who-n{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.who-n i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.who-n i.done{background:var(--mint)}
.who-n i.cur{background:var(--saffron);transform:scale(1.3)}
.who-card .mid{color:var(--ink)!important;overflow-wrap:anywhere}
.who-rev{flex:none}
